name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # This name is the required status check in branch protection — keep it stable.
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shelfwise_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shelfwise_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # e2e tests (apps/api/vitest.config.e2e.ts) run against the service container.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/shelfwise_test
      # Required by apps/web env validation at build time; no real API is called.
      API_ORIGIN: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Also runs `prisma generate` via the apps/api postinstall script.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
