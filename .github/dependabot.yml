version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # All work lands in develop; main only receives release PRs.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # One PR per week for non-breaking updates instead of dozens.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose — see CLAUDE.md "Tooling notes".
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
